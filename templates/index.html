<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Chemical Reaction Predictor</title>
    <style>
        :root {
            --bg-1: #eef2f7;
            --bg-2: #dbe6ea;
            --card: #ffffff;
            --card-2: #f8fafc;
            --text: #1f2937;
            --muted: #64748b;
            --accent: #00897b;
            --accent-strong: #00695c;
            --accent-soft: rgba(0, 137, 123, 0.12);
            --border: #e2e8f0;
            --input-bg: #ffffff;
            --shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
            --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.08);
            --radius: 16px;
            --header-bg: rgba(255, 255, 255, 0.72);
            --header-text: #0f172a;
            --header-sub: #475569;
            --eq-text: #0f172a;
            --th-bg: #f1f5f9;
            --th-text: #334155;
            --row-border: #eef2f7;
            --success-bg: #ecfdf5;
            --success-border: #a7f3d0;
            --success-text: #065f46;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --error-text: #b91c1c;
            --badge-bg: #ccfbf1;
            --badge-text: #115e59;
            --remove-bg: #fee2e2;
            --remove-text: #b91c1c;
            --dashed-border: #cbd5e1;
            --hover: #eef2f7;
            --spin-track: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg-1: #0b1220;
            --bg-2: #0f1f2b;
            --card: #111a2b;
            --card-2: #0f1827;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #2dd4bf;
            --accent-strong: #14b8a6;
            --accent-soft: rgba(45, 212, 191, 0.12);
            --border: #1e293b;
            --input-bg: #0f1827;
            --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.3);
            --header-bg: rgba(10, 16, 28, 0.72);
            --header-text: #f1f5f9;
            --header-sub: #94a3b8;
            --eq-text: #f1f5f9;
            --th-bg: #0f1827;
            --th-text: #cbd5e1;
            --row-border: #1e293b;
            --success-bg: #04221a;
            --success-border: #134e4a;
            --success-text: #6ee7b7;
            --error-bg: #2a1214;
            --error-border: #7f1d1d;
            --error-text: #fca5a5;
            --badge-bg: #134e4a;
            --badge-text: #5eead4;
            --remove-bg: #3f1d1f;
            --remove-text: #fca5a5;
            --dashed-border: #334155;
            --hover: #172136;
            --spin-track: #1e293b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%) fixed;
            color: var(--text);
            line-height: 1.6;
            transition: background 0.3s ease, color 0.3s ease;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0.9rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .brand { display: flex; align-items: center; gap: 0.7rem; }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #fff;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        .brand h1 {
            margin: 0;
            font-size: 1.35rem;
            letter-spacing: 0.3px;
            color: var(--header-text);
        }

        .brand p {
            margin: 0;
            color: var(--header-sub);
            font-size: 0.85rem;
        }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
            box-shadow: var(--shadow-sm);
        }

        .theme-toggle:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .theme-toggle svg { width: 18px; height: 18px; }

        main {
            max-width: 1080px;
            margin: 1.5rem auto;
            padding: 0 1.25rem 3rem;
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
            gap: 1.4rem;
            align-items: start;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.6rem 1.6rem 1.4rem;
            box-shadow: var(--shadow);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .card h2 {
            margin: 0 0 1rem;
            font-size: 1.15rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card h2::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 3px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            display: inline-block;
        }

        label {
            display: block;
            font-weight: 600;
            margin: 1rem 0 0.35rem;
            font-size: 0.9rem;
            color: var(--text);
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 0.65rem 0.85rem;
            font-size: 1rem;
            color: var(--text);
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .reactant-row {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            margin-bottom: 0.6rem;
        }

        .reactant-row .name-input { flex: 2; }
        .reactant-row .mass-input { flex: 1; min-width: 90px; }

        .remove-btn {
            background: var(--remove-bg);
            color: var(--remove-text);
            border: none;
            border-radius: 10px;
            padding: 0.6rem 0.8rem;
            cursor: pointer;
            font-weight: 700;
            line-height: 1;
            transition: filter 0.2s ease, transform 0.2s ease;
        }

        .remove-btn:hover { filter: brightness(1.05); transform: scale(1.05); }

        .add-btn {
            background: transparent;
            border: 1px dashed var(--dashed-border);
            color: var(--muted);
            border-radius: 10px;
            padding: 0.55rem 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .add-btn:hover { background: var(--hover); color: var(--text); }

        .actions { margin-top: 1.2rem; }

        button[type="submit"] {
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #fff;
            border: none;
            padding: 0.85rem 2rem;
            font-size: 1.02rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 6px 18px var(--accent-soft);
        }

        button[type="submit"]:hover { transform: translateY(-2px); box-shadow: 0 10px 24px var(--accent-soft); }
        button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .hint {
            font-size: 0.82rem;
            color: var(--muted);
            margin-top: 1.1rem;
            padding-top: 0.9rem;
            border-top: 1px solid var(--border);
        }

        /* ---------- results column ---------- */
        .results-col {
            position: sticky;
            top: 6.2rem;
            min-height: 60vh;
        }

        .result-placeholder {
            display: grid;
            place-items: center;
            text-align: center;
            color: var(--muted);
            padding: 3.5rem 1.5rem;
            gap: 1rem;
        }

        .result-placeholder svg {
            width: 64px;
            height: 64px;
            opacity: 0.5;
        }

        .result-placeholder .title { font-size: 1.05rem; font-weight: 600; color: var(--text); }
        .result-placeholder .sub { font-size: 0.88rem; max-width: 300px; }

        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid var(--spin-track);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 0.8rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-box, .error-box { animation: fadeUp 0.35s ease; }

        .error-box {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 1.1rem 1.2rem;
            border-radius: var(--radius);
        }

        .success-box {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--text);
            padding: 1.2rem 1.3rem;
            border-radius: var(--radius);
        }

        .badge {
            display: inline-block;
            background: var(--badge-bg);
            color: var(--badge-text);
            border-radius: 999px;
            padding: 0.22rem 0.8rem;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: capitalize;
            letter-spacing: 0.4px;
        }

        .result-title {
            margin: 0.7rem 0 0.2rem;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
        }

        .equation {
            font-size: 1.35rem;
            font-weight: 600;
            margin: 0.5rem 0 0.7rem;
            color: var(--eq-text);
            padding: 0.8rem;
            background: var(--card-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-align: center;
        }

        .notes { color: var(--muted); font-size: 0.86rem; margin-bottom: 0.9rem; }

        .limiting {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            margin-bottom: 0.7rem;
            padding: 0.6rem 0.8rem;
            background: var(--accent-soft);
            border-radius: 10px;
            color: var(--text);
        }

        .limiting strong { color: var(--accent); }

        h4 { margin: 1rem 0 0.3rem; font-size: 0.9rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            text-align: left;
            padding: 0.5rem 0.6rem;
            border-bottom: 1px solid var(--row-border);
        }

        th {
            background: var(--th-bg);
            color: var(--th-text);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        th:first-child, td:first-child { border-top-left-radius: 8px; }
        th:last-child, td:last-child { border-top-right-radius: 8px; }

        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
            .results-col {
                position: static;
                min-height: 0;
            }
            header { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <div class="brand-logo">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 2v6.5L4.5 17a2.5 2.5 0 0 0 2.16 3.72h10.68A2.5 2.5 0 0 0 19.5 17L14 8.5V2"/>
                <path d="M8 13h8"/>
            </svg>
        </div>
        <div>
            <h1>Chemical Reaction Predictor</h1>
            <p>Predict the reaction, products, and limiting reagent</p>
        </div>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
        <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <span id="themeLabel">Dark</span>
    </button>
</header>

<main>
    <!-- LEFT: inputs -->
    <section class="card">
        <h2>Reactants</h2>
        <form id="predictForm">
            <div id="reactants"></div>
            <button type="button" class="add-btn" id="addReactant">+ Add reactant</button>

            <label for="temperature">Temperature (°C)</label>
            <input type="number" step="any" id="temperature" name="temperature" placeholder="e.g. 25" required>

            <div class="actions">
                <button type="submit" id="predictBtn">Predict</button>
            </div>
        </form>

        <div class="hint">
            Example: 5 g of sodium + 100 g of water at 25 °C &rarr; sodium hydroxide + hydrogen gas.
            Try "calcium carbonate" at 900 °C for a decomposition, or "methane" + "oxygen" at 600 °C to burn it.
        </div>
    </section>

    <!-- RIGHT: results -->
    <aside class="card results-col">
        <h2>Result</h2>
        <div id="result"></div>
    </aside>
</main>

<script>
(function () {
    const reactantsBox = document.getElementById('reactants');
    const resultBox = document.getElementById('result');
    const form = document.getElementById('predictForm');
    const btn = document.getElementById('predictBtn');
    const themeToggle = document.getElementById('themeToggle');
    const iconSun = document.getElementById('iconSun');
    const iconMoon = document.getElementById('iconMoon');
    const themeLabel = document.getElementById('themeLabel');

    /* ---------------- theme ---------------- */
    function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        iconMoon.style.display = theme === 'dark' ? 'block' : 'none';
        iconSun.style.display = theme === 'dark' ? 'none' : 'block';
        themeLabel.textContent = theme === 'dark' ? 'Light' : 'Dark';
    }

    function storedTheme() {
        try { return localStorage.getItem('theme'); } catch (e) { return null; }
    }

    function systemTheme() {
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    applyTheme(storedTheme() || systemTheme());

    themeToggle.addEventListener('click', function () {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        try { localStorage.setItem('theme', next); } catch (e) { /* ignore */ }
    });

    /* ---------------- result helpers ---------------- */
    function showPlaceholder() {
        resultBox.innerHTML = `
            <div class="result-placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 2v6.5L4.5 17a2.5 2.5 0 0 0 2.16 3.72h10.68A2.5 2.5 0 0 0 19.5 17L14 8.5V2"/>
                    <path d="M8 13h8"/>
                </svg>
                <div class="title">Your result will appear here</div>
                <div class="sub">Enter reactants, their masses, and a temperature, then hit Predict.</div>
            </div>`;
    }

    function showLoading() {
        resultBox.innerHTML = `
            <div class="result-placeholder">
                <div class="spinner"></div>
                <div class="title">Predicting reaction...</div>
            </div>`;
    }

    /* ---------------- reactant rows ---------------- */
    function rowTemplate(name, mass) {
        return `
            <div class="reactant-row">
                <input class="name-input" type="text" list="catalog-list" placeholder="Chemical name (e.g. sodium)" value="${name || ''}">
                <input class="mass-input" type="number" step="any" min="0.001" placeholder="mass (g)" value="${mass != null ? mass : ''}">
                <button type="button" class="remove-btn" title="Remove">&times;</button>
            </div>`;
    }

    function addRow(name, mass) {
        const div = document.createElement('div');
        div.innerHTML = rowTemplate(name, mass);
        const row = div.firstElementChild;
        row.querySelector('.remove-btn').addEventListener('click', function () {
            row.remove();
        });
        reactantsBox.appendChild(row);
    }

    function resetRows() {
        reactantsBox.innerHTML = '';
        addRow('', '');
        addRow('', '');
    }

    function showError(msg) {
        resultBox.innerHTML = `<div class="error-box">${escapeHtml(msg)}</div>`;
    }

    function collect() {
        const rows = [...reactantsBox.querySelectorAll('.reactant-row')];
        const reactants = [];
        for (const row of rows) {
            const name = row.querySelector('.name-input').value.trim();
            const mass = row.querySelector('.mass-input').value.trim();
            if (!name && !mass) continue;
            if (!name) { showError('A row has a mass but no chemical name.'); return null; }
            if (!mass) { showError('Enter a mass (g) for "' + name + '".'); return null; }
            reactants.push({ name: name, mass_g: parseFloat(mass) });
        }
        return reactants;
    }

    function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
    }

    function renderResult(data) {
        if (!data.matched) {
            showError(data.error || 'No reaction found.');
            return;
        }
        const prodRows = data.products.map(function (p) {
            return `<tr><td>${escapeHtml(p.name)}</td><td>${p.formula}</td><td>${p.moles}</td><td>${p.grams}</td></tr>`;
        }).join('');
        let leftRows = '';
        if (data.leftover && data.leftover.length) {
            leftRows = data.leftover.map(function (p) {
                return `<tr><td>${escapeHtml(p.name)}</td><td>${p.formula}</td><td>${p.moles}</td><td>${p.grams}</td></tr>`;
            }).join('');
        }
        resultBox.innerHTML = `
            <div class="success-box">
                <span class="badge">${escapeHtml(data.reaction_type || 'reaction')}</span>
                <div class="result-title">${escapeHtml(data.reaction_name || 'Reaction')}</div>
                <div class="equation">${data.equation_display || escapeHtml(data.equation)}</div>
                ${data.notes ? `<div class="notes">${escapeHtml(data.notes)}</div>` : ''}
                ${data.limiting_reagent ? `<div class="limiting"><strong>Limiting reagent:</strong> ${escapeHtml(data.limiting_reagent)}</div>` : ''}
                <table>
                    <thead><tr><th>Product</th><th>Formula</th><th>Moles</th><th>Mass (g)</th></tr></thead>
                    <tbody>${prodRows}</tbody>
                </table>
                ${leftRows ? `
                <h4>Left over</h4>
                <table>
                    <thead><tr><th>Reactant</th><th>Formula</th><th>Moles</th><th>Mass (g)</th></tr></thead>
                    <tbody>${leftRows}</tbody>
                </table>` : ''}
                ${data.description ? `<div class="notes" style="margin-top:0.8rem">${escapeHtml(data.description)}</div>` : ''}
            </div>`;
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        const reactants = collect();
        if (!reactants) return;
        const temperature = parseFloat(document.getElementById('temperature').value);
        if (isNaN(temperature)) {
            showError('Enter a temperature in °C.');
            return;
        }
        btn.disabled = true;
        btn.textContent = 'Predicting...';
        showLoading();

        fetch('/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reactants: reactants, temperature: temperature })
        })
        .then(function (r) { return r.json(); })
        .then(renderResult)
        .catch(function (err) {
            showError('Network error: ' + err.message);
        })
        .finally(function () {
            btn.disabled = false;
            btn.textContent = 'Predict';
        });
    });

    document.getElementById('addReactant').addEventListener('click', function () {
        addRow('', '');
    });

    fetch('/api/chemicals')
        .then(function (r) { return r.json(); })
        .then(function (data) {
            const dl = document.createElement('datalist');
            dl.id = 'catalog-list';
            data.forEach(function (c) {
                const opt = document.createElement('option');
                opt.value = c.name;
                opt.label = c.formula;
                dl.appendChild(opt);
            });
            document.body.appendChild(dl);
        })
        .catch(function () { /* catalog picker is optional */ });

    resetRows();
    showPlaceholder();
})();
</script>

</body>
</html>
